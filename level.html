<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Level - Kali-Pinter</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; 
            background-color: #f0f0f0; 
        }

        .container-app {
            position: relative;
            width: auto;
            height: 100vh;
            aspect-ratio: 3 / 4; 
            background-image: url('bg kosong.jpg.jpeg'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Tombol Keluar di pojok kiri atas */
        .btn-keluar {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #f44336;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        /* Warna judul menjadi hitam */
        h1 { color: black; text-align: center; margin-bottom: 20px; font-size: 4vh; }

        .pilihan-wrapper {
            display: flex;
            flex-direction: column;
            width: 80%;
            gap: 15px; /* Jarak antar tombol */
        }

        .btn-level {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .hijau { background: #4caf50; }
        .kuning { background: #ffc107; }
        .merah { background: #f44336; }
    </style>
</head>
<body>

<div class="container-app">
    <a href="index.html" class="btn-keluar">← Keluar</a>

    <h1>Pilih Level Mingguan 🎮</h1>
    
    <div class="pilihan-wrapper">
        <button class="btn-level hijau" onclick="pilihLevel('Mudah')">
            Level Mudah<br><small style="font-size: 12px;">Perkalian 1-5</small>
        </button>
        <button class="btn-level kuning" onclick="pilihLevel('Menengah')">
            Level Menengah<br><small style="font-size: 12px;">Perkalian 6-8</small>
        </button>
        <button class="btn-level merah" onclick="pilihLevel('Sulit')">
            Level Sulit<br><small style="font-size: 12px;">Perkalian 9-12</small>
        </button>
    </div>
</div>

<script>
    function pilihLevel(level) { window.location.href = 'game_play.html?level=' + level; }
</script>

</body>
</html>
