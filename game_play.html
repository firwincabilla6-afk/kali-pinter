<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kali-Pinter</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #b3e5fc; font-family: 'Arial', sans-serif; }
        
        /* Container dengan Background */
        .container-game { width: 400px; height: 650px; background: url('bg kosong.jpg.jpeg') no-repeat center center; background-size: cover; border-radius: 40px; border: 8px solid white; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        /* Panel Info Level (Latar Putih) */
        .info-panel { position: absolute; top: 20px; right: 20px; background: white; padding: 10px 20px; border-radius: 20px; text-align: right; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: bold; }
        .btn-keluar { position: absolute; top: 20px; left: 20px; background: #ff5252; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* Area Angka */
        .content { margin-top: 150px; display: flex; flex-direction: column; align-items: center; }
        .angka-besar { font-size: 80px; font-weight: bold; color: #00bcd4; }
        .simbol-sama { font-size: 50px; color: #00bcd4; margin-bottom: 20px; }
        
        /* Pilihan & Tombol */
        .wrapper-pilihan { display: flex; gap: 15px; margin-bottom: 30px; }
        .opsi-lingkar { width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; font-size: 30px; cursor: pointer; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Layar Hasil */
        #layarHasil { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; border-radius: 35px; z-index: 10; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .img-hasil { width: 150px; margin-bottom: 20px; }
    </style>
</head>
<body>

<audio id="musikGame" loop><source src="musik_anak.mp3" type="audio/mpeg"></audio>

<div class="container-game">
    <button class="btn-keluar" onclick="window.location.href='level.html'">← Keluar</button>
    <div class="info-panel">
        <div id="txtLevel">Level: Mudah</div>
        <div id="txtSkor">Skor: 0</div>
        <div id="txtSoal">Soal: 1/10</div>
    </div>
    
    <div class="content">
        <div class="angka-besar"><span id="angkaKiri">?</span> × <span id="angkaKanan">?</span></div>
        <div class="simbol-sama">=</div>
        
        <div class="wrapper-pilihan">
            <button class="opsi-lingkar" id="btn0" onclick="cekJawaban(0)" style="background: #ff8a80;"></button>
            <button class="opsi-lingkar" id="btn1" onclick="cekJawaban(1)" style="background: #ffd54f;"></button>
            <button class="opsi-lingkar" id="btn2" onclick="cekJawaban(2)" style="background: #4fc3f7;"></button>
        </div>
    </div>

    <div id="layarHasil">
        <img id="imgHasil" class="img-hasil" src="" alt="Hasil">
        <h1 id="judulHasil">GAME SELESAI!</h1>
        <p>Skor Akhir Kamu:</p>
        <h2 id="skorAkhir" style="font-size: 60px; margin: 0;">0</h2>
        <p id="pesanApresiasi" style="font-size: 20px; font-weight: bold;"></p>
        <button onclick="window.location.href='level.html'" style="padding: 15px 30px; border-radius: 20px; border:none; background: #00bcd4; color: white; cursor: pointer;">Pilih Level Lain</button>
    </div>
</div>

<script>
    document.body.addEventListener('click', () => document.getElementById('musikGame').play(), { once: true });

    const urlParams = new URLSearchParams(window.location.search);
    let level = urlParams.get('level') || 'Mudah';
    document.getElementById('txtLevel').innerText = "Level: " + level;

    let skor = 0, jumlahSoal = 1;

    function buatSoal() {
        if (jumlahSoal > 10) {
            tampilkanHasil();
            return;
        }
        document.getElementById('txtSoal').innerText = "Soal: " + jumlahSoal + "/10";
        let min = (level === 'Sulit') ? 9 : (level === 'Menengah') ? 6 : 1;
        let max = (level === 'Sulit') ? 12 : (level === 'Menengah') ? 8 : 5;
        let a = Math.floor(Math.random() * (max - min + 1)) + min;
        let b = Math.floor(Math.random() * (max - min + 1)) + min;
        
        document.getElementById('angkaKiri').innerText = a;
        document.getElementById('angkaKanan').innerText = b;
        
        let benar = a * b;
        let opsi = [benar, benar + 3, benar - 2].sort(() => Math.random() - 0.5);
        for(let i=0; i<3; i++) {
            document.getElementById('btn'+i).innerText = opsi[i];
            document.getElementById('btn'+i).dataset.val = opsi[i];
            document.getElementById('btn'+i).dataset.benar = benar;
        }
    }

    function cekJawaban(idx) {
        let btn = document.getElementById('btn'+idx);
        if (parseInt(btn.innerText) == btn.dataset.benar) skor += 10;
        jumlahSoal++;
        document.getElementById('txtSkor').innerText = "Skor: " + skor;
        buatSoal();
    }

    function tampilkanHasil() {
        document.getElementById('layarHasil').style.display = 'flex';
        document.getElementById('skorAkhir').innerText = skor;
        // Ganti nama file di bawah sesuai dengan nama file gambar yang kamu punya
        document.getElementById('imgHasil').src = (skor >= 60) ? "menang.png" : "kalah.png";
        document.getElementById('pesanApresiasi').innerText = (skor >= 60) ? "Hebat! Kamu Pintar Sekali!" : "Ayo Coba Lagi! Jangan Menyerah Ya!";
    }

    buatSoal();
</script>
</body>
</html>
